<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .wm-auto {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-weight: 600;
      fill: #111827;
      font-size: 96px;
      letter-spacing: -3px;
    }
    .wm-dmx {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-weight: 700;
      fill: #09090b;
      font-size: 96px;
      letter-spacing: -3px;
    }
    .tagline {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-weight: 500;
      fill: #71717a;
      font-size: 18px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
  </style>

  <!-- Light canvas to match the app's #fafafc surface -->
  <rect width="100%" height="100%" fill="#fafafc" rx="24" />

  <!-- MARK: clean monochrome 'A' with subtle motion lines (neutral, no neon) -->
  <g transform="translate(400, 200)">
    <!-- Subtle motion lines on the left, neutral gray, thin and quiet -->
    <rect x="-150" y="-10"  width="55" height="8" rx="4" fill="#e4e4e7" />
    <rect x="-170" y="22"  width="75" height="8" rx="4" fill="#e4e4e7" />
    <rect x="-140" y="54"  width="55" height="8" rx="4" fill="#e4e4e7" />

    <!-- Outer A shape, solid #111827 like app foreground -->
    <path d="M -70 80
             L 0 -80
             L 70 80
             L 40 80
             L 30 56
             L -30 56
             L -40 80 Z
             M -18 32
             L 0 -8
             L 18 32 Z"
          fill="#111827" fill-rule="evenodd" />

    <!-- Inner speech-bubble dot (single accent, restrained) -->
    <circle cx="0" cy="-32" r="5" fill="#fafafc" />
  </g>

  <!-- WORDMARK -->
  <g transform="translate(400, 380)" text-anchor="middle">
    <text>
      <tspan class="wm-auto">Auto</tspan><tspan class="wm-dmx">DMX</tspan>
    </text>
  </g>

  <!-- TAGLINE with flanking hairline rules -->
  <g transform="translate(0, 440)">
    <line x1="180" y1="0" x2="290" y2="0" stroke="#e4e4e7" stroke-width="1.5" stroke-linecap="round" />
    <text x="400" y="6" text-anchor="middle" class="tagline">Automate. Engage. Convert.</text>
    <line x1="510" y1="0" x2="620" y2="0" stroke="#e4e4e7" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
