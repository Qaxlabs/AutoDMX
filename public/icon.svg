<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Matches app foreground (#111827 on #fafafc) -->
  <rect width="500" height="500" fill="#fafafc" />

  <!-- Speech-bubble-rounded container, light, neutral -->
  <rect x="60" y="60" width="380" height="380" rx="96" fill="#ffffff" stroke="#e4e4e7" stroke-width="2" />

  <g transform="translate(250, 250)">
    <!-- Motion lines (subtle, gray) -->
    <rect x="-160" y="-12" width="60" height="10" rx="5" fill="#e4e4e7" />
    <rect x="-180" y="24"  width="80" height="10" rx="5" fill="#e4e4e7" />
    <rect x="-150" y="60"  width="60" height="10" rx="5" fill="#e4e4e7" />

    <!-- A shape -->
    <path d="M -80 100
             L 0 -100
             L 80 100
             L 46 100
             L 34 70
             L -34 70
             L -46 100 Z
             M -20 38
             L 0 -12
             L 20 38 Z"
          fill="#111827" fill-rule="evenodd" />

    <!-- Tiny dot (the only accent) -->
    <circle cx="0" cy="-44" r="6" fill="#ffffff" />
  </g>
</svg>
